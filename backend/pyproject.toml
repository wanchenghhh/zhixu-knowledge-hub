[project]
name = "zhixu-knowledge-backend"
version = "1.2.1"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "openai>=2.45,<3",
  "langchain-text-splitters>=1,<2",
  "cryptography>=44",
  "python-multipart>=0.0.20",
  "httpx>=0.28,<1",
  "celery[redis]>=5.5,<6",
  "jieba>=0.42",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "alibabacloud-docmind-api20220711>=1.0",
  "regex>=2024.11",
  "tiktoken>=0.14,<1",
  "vercel-blob==0.5.0",
  "vercel-celery==0.7.10"
]

[tool.vercel]
entrypoint = "cloud:app"

[[tool.vercel.subscribers]]
entrypoint = "cloud_worker:celery"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
